[project]
name = "flyconn-bench"
version = "0.1.0.dev0"
description = "Hugging Face snapshots of harmonized Drosophila connectomes from flyconn, and (later) the FlyGraphBench ML benchmark."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "flyconn contributors" }]
keywords = ["connectome", "drosophila", "neuroscience", "huggingface", "benchmark"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "flyconn>=0.4,<0.5",
  "duckdb>=1.0",
  "pyarrow>=15",
  "pyyaml>=6",
  "typer>=0.12",
  "huggingface_hub>=1.0",
]

[project.optional-dependencies]
# `datasets` is only needed to round-trip-check an export (tests, `verify`).
datasets = ["datasets>=4"]

[project.scripts]
flyconn-bench = "flyconn_bench.cli:app"

[project.urls]
Repository = "https://github.com/moiz-lakkadkutta/flyconn-bench"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "datasets>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyconn_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "RUF", "NPY", "PD"]
ignore = ["PD002", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "PD", "E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "golden: uses cached real flyconn stores (slow; not run in default CI)",
  "network: touches the network (never in unit CI)",
]
